[project]
name = "abliteration-prefill"
version = "0.1.0"
description = "Prefilling vs. abliteration refusal study: target generation and StrongREJECT grading"
# Upper bound is deliberate: one interpreter keeps the lock to one resolution.
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "inspect-ai==0.3.251",
]

# `==` pins change results if they float; bumping one is a study decision.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "transformers==5.14.1",
    "jinja2>=3.0",
    "rfc8785>=0.1",
    "pyarrow>=17.0",  # backs inspect_ai.analysis.samples_df
]
gpu = ["torch==2.11.0", "transformers==5.14.1", "accelerate==1.14.0"]

# cu128 is the newest runtime the A100 driver loads.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

# Inspect imports this when it resolves a model name, so `qwen-local/...` works
# from the `inspect` CLI too, with nothing having imported the package first.
[project.entry-points.inspect_ai]
harness = "harness._registry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
markers = [
    "live: test makes a real (paid) OpenAI API call; deselect with -m 'not live'",
]
