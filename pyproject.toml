[project]
name = "abliteration-prefill-grading"
version = "0.1.0"
description = "S1 StrongREJECT grading environment (gpt-4o-mini, API-only)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: test makes a real (paid) OpenAI API call; deselect with -m 'not live'",
]
