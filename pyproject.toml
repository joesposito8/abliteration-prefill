[project]
name = "abliteration-prefill"
version = "0.1.0"
description = "Prefilling vs. abliteration refusal study: target generation and StrongREJECT grading"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# transformers + jinja2 (no torch) is enough to render chat templates offline.
dev = ["pytest>=8.0", "transformers>=4.56", "jinja2>=3.0", "rfc8785>=0.1"]
gpu = ["torch>=2.4", "transformers>=4.56", "accelerate>=0.30"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: test makes a real (paid) OpenAI API call; deselect with -m 'not live'",
]
